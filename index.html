<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER WEB APP</title>
    <link rel="icon" type="image/png" href="sunny.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="title">“Weather, made simple.”</div>
    <div class="card">

        <div class="search-bar">
            <input class="search-inp" placeholder="Enter City Name" type="text" name="city" value="" id="search">
            <label for="search" class="search-label"></label>
            <button class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </div>


    <div class="weather-details">
        <div class="first">
            <div class="weather-visual"></div>
            <div class="temperature"></div>
            <div class="city"></div>
        </div>
        <div class="other-details">
            <div class="humidity">
                <div class="humidity-img"></div>
                <div class="humidity-reading"></div>
            </div>
            <div class="wind">
                <div class="wind-img"></div>
                <div class="wind-reading"></div>
            </div>
        </div>


    </div>


    <script src="script.js"></script>
</body>

</html>
